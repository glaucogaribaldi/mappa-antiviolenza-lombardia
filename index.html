    <!-- SYNCHRONOUS JS LIBRARIES -->
    <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
    
    <script>
        // CONFIGURAZIONE GLOBALE MAPPA & STATI
        let map;
        let markers = [];
        let infoWindow;
        let clusterers = {};
        let allFacilities = []; // Dynamic store for all GSheet parsed records
        let referencePoint = { lat: 45.4642, lng: 9.1900, isUserLocated: false }; // Default Milano, updated on GPS/Search
        let listCategoryFilter = 'CAV'; // Default filter in Tab 2 ("Centri CAV")
        let listRenderLimit = 30; // Virtual pagination limit for 0ms UI lag
        let lastFilteredFacilities = [];

        // CALCOLO DISTANZA HAVERSINE IN KM ("PIÙ VICINI A TE")
        function computeDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371.0;
            const dLat = (lat2 - lat1) * Math.PI / 180.0;
            const dLon = (lon2 - lon1) * Math.PI / 180.0;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180.0) * Math.cos(lat2 * Math.PI / 180.0) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function formatDistanceBadge(distKm) {
            if (distKm === null || distKm === undefined || isNaN(distKm)) return "";
            if (distKm < 1.0) {
                return `${Math.max(50, Math.round(distKm * 1000 / 50) * 50)} m`;
            }
            return `${distKm.toFixed(1).replace('.', ',')} km`;
        }

        // MOTORE TELEFONICO INTELLIGENTE (MULTI-NUMERO, PULIZIA INTERNI E FALLBACK SICURI 112/1522)
        function parsePhoneNumbers(rawTel, category) {
            const defaultNum = (category === "CAV") ? "1522" : "112";
            const defaultLabel = (category === "CAV") ? "Antiviolenza 1522" : "Emergenza 112";
            if (!rawTel) {
                return [{ href: `tel:${defaultNum}`, label: defaultLabel, note: "", isEmergency: true }];
            }
            const s = rawTel.toString().trim();
            if (!s || s === "112" || s === "112 / 118" || s === "112 / 113" || s === "1522") {
                const num = (s === "1522") ? "1522" : defaultNum;
                const lbl = (num === "1522") ? "Antiviolenza 1522" : "Emergenza 112";
                return [{ href: `tel:${num}`, label: lbl, note: "", isEmergency: true }];
            }

            // Estrae eventuali note tra parentesi es. "(int.3)" o "(numero attivo in orari di apertura)"
            const notes = s.match(/\([^)]+\)/g) || [];
            const noteStr = notes.join(" ");
            const sNoNotes = s.replace(/\([^)]+\)/g, "");

            // Normalizza lo slash del prefisso (es. "02/55019609" o "0383 / 1915589" -> "02 55019609")
            let sNorm = sNoNotes.replace(/\b(0\d{1,3})\s*\/\s*(\d)/g, "$1 $2");
            sNorm = sNorm.replace(/\b(3\d{2})\s*\/\s*(\d)/g, "$1 $2");

            // Separa numeri multipli divisi da " - ", ";" o " / "
            const parts = sNorm.split(/\s*[-;/]\s*/);
            const results = [];
            parts.forEach(p => {
                const cleanLabel = p.trim().replace(/\s+/g, " ");
                if (!cleanLabel) return;
                const digits = cleanLabel.replace(/[^0-9+]/g, "");
                if (digits.length >= 3) {
                    results.push({
                        href: `tel:${digits}`,
                        label: cleanLabel,
                        note: noteStr,
                        isEmergency: (digits === "112" || digits === "1522" || digits === "118")
                    });
                }
            });

            if (results.length === 0) {
                return [{ href: `tel:${defaultNum}`, label: defaultLabel, note: "", isEmergency: true }];
            }
            return results;
        }

        // UTILITY DI SICUREZZA PER SANIFICAZIONE XSS & URI SCHEMES (STORED XSS PREVENTION)
        function escapeHTML(str) {
            if (!str) return "";
            return str.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function sanitizeURL(url) {
            if (!url) return "";
            const trimmed = url.trim().toLowerCase();
            if (trimmed.startsWith("javascript:") || trimmed.startsWith("data:")) {
                return "#";
            }
            return url;
        }

        // TAB NAVIGATION LOGIC (2-Tab Layout: Mappa & Centri CAV)
        function switchTab(tabId) {
            closeBottomSheet();
            
            const mapContent = document.getElementById("tab-map-content");
            const listContent = document.getElementById("tab-list-content");

            const mapBtn = document.getElementById("tab-map-btn");
            const listBtn = document.getElementById("tab-list-btn");

            // Hide all tab screens
            if (mapContent) mapContent.classList.add("hidden");
            if (listContent) listContent.classList.add("hidden");

            // Deactivate all buttons
            [mapBtn, listBtn].forEach(btn => {
                if (!btn) return;
                btn.classList.remove("text-primary", "font-bold");
                btn.classList.add("text-gray-500");
            });

            // Activate specific tab screen and button
            if (tabId === 'map' && mapContent && mapBtn) {
                mapContent.classList.remove("hidden");
                mapBtn.classList.add("text-primary", "font-bold");
                mapBtn.classList.remove("text-gray-500");
                // Trigger maps resize to avoid gray areas
                if (map) google.maps.event.trigger(map, 'resize');
            } else if (tabId === 'list' && listContent && listBtn) {
                listContent.classList.remove("hidden");
                listBtn.classList.add("text-primary", "font-bold");
                listBtn.classList.remove("text-gray-500");
            }
        }

        // ACCORDION LOGIC
        function toggleAccordion(id, btn) {
            const content = document.getElementById(id);
            const icon = btn.querySelector(".accordion-icon");
            const isOpen = content.classList.toggle("hidden");
            if (!isOpen) {
                icon.classList.add("rotate-180");
            } else {
                icon.classList.remove("rotate-180");
            }
        }

        // =========================================================================
        // CONFIGURAZIONE DATABASE LIVE (GOOGLE SHEETS)

                const size = count < 10 ? 28 : count < 100 ? 34 : 40;
                const radius = size / 2;
                
                const svg = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
                        <circle cx="${radius}" cy="${radius}" r="${radius - 2}" fill="#374151" fill-opacity="0.95" stroke="#FFFFFF" stroke-width="2"/>
                        <text x="${radius}" y="${radius + 4}" font-family="-apple-system, sans-serif" font-size="11px" font-weight="bold" fill="#FFFFFF" text-anchor="middle">${count}</text>
                    </svg>
                `);
                
                return new google.maps.Marker({
                    position,
                    icon: {
                        url: svg,
                        scaledSize: new google.maps.Size(size, size),
                        anchor: new google.maps.Point(radius, radius)
                    },

                    zIndex: google.maps.Marker.MAX_ZINDEX + count
                });
            }
        };

        // PARSER CSV INTEGRATO COMPATIBILE CON LO STANDARD RFC-4180
        function parseCSV(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                const next = text[i+1];

                if (c === '"') {
                    if (inQuotes && next === '"') {
                        row[row.length - 1] += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (c === ',' && !inQuotes) {
                    row.push("");
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') {
                        i++;
                    }
                    lines.push(row);
                    row = [""];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== "") {
                lines.push(row);
            }
            
            if (lines.length === 0) return [];
            
            const headers = lines[0].map(h => h.trim().toLowerCase());
            const result = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i];
                if (values.length < headers.length) continue;
                
                const obj = {};
                headers.forEach((header, index) => {
                    obj[header] = values[index] ? values[index].trim() : "";
                });
                result.push(obj);
            }
            return result;
        }

        // CARICAMENTO DEI LAYER CSV (IN PARALLELO PER MASSIME PRESTAZIONI DI AVVIO)
        async function loadAllLayers() {
            const promises = Object.entries(layers).map(async ([key, config]) => {
                try {
                    let url = config.file;
                    if (GOOGLE_SHEET_URL) {
                        url = `${GOOGLE_SHEET_URL}?gid=${config.gid}&output=csv`;
                    }
                    const response = await fetch(url);
                    const csvText = await response.text();
                    const rows = parseCSV(csvText);
                    renderFeaturesFromCSV(rows, key);
                } catch (e) {
                    console.error(`Error loading layer ${key}:`, e);
                }
            });
            await Promise.all(promises);
        }

        // RENDERING DELLE FEATURES SULLA MAPPA DA DATI CSV (LOCALI O GOOGLE SHEETS)
        function renderFeaturesFromCSV(rows, category) {
            const tempMarkers = [];
            if (!rows) return;
            
            rows.forEach(row => {
                try {
                    const lat = parseFloat(row.latitudine || row.lat);
                    const lng = parseFloat(row.longitudine || row.lng || row.lon);
                    if (isNaN(lat) || isNaN(lng)) return;
                    
                    const latLng = new google.maps.LatLng(lat, lng);
                    
                    const props = {
                        name: row.nome || row.name || "",
                        tipo: row.tipo || "",
                        indirizzo: row.indirizzo || row.address || "",
                        comune: row.comune || "",
                        provincia: row.provincia || "",
                        telefono: row.telefono || row.phone || "",
                        email: row.email || "",
                        sito_web: row.sito_web || row.website || row.sito_web_url || "",
                        orari: row.orari || row.hours || "",
                        codice_rosa: row.codice_rosa || "",
                        bollino_rosa: row.bollino_rosa || "",
                        servizi: row.servizi || "",
                        lat: lat,
                        lng: lng
                    };

                    let iconUrl = "";
                    if (category === "CAV") {
                        iconUrl = "data/marker_cav.png";
                    } else if (category === "SANITA") {
                        iconUrl = "data/marker_hospital.png";
                    } else if (category === "FORZE_ORDINE") {
                        if (props.tipo === "Arma dei Carabinieri") {
                            iconUrl = "data/marker_police_carabinieri.png";
                        } else if (props.tipo === "Polizia di Stato") {
                            iconUrl = "data/marker_police_stato.png";
                        } else if (props.tipo === "Polizia Locale") {
                            iconUrl = "data/marker_police_locale.png";
                        } else {
                            iconUrl = "data/marker_police_generico.png";
                        }
                    }

                    const marker = new google.maps.Marker({
                        position: latLng,
                        title: props.name,
                        icon: {
                            url: iconUrl,
                            scaledSize: new google.maps.Size(24, 24),
                            anchor: new google.maps.Point(12, 12)
                        }
                    });

                    const geoInfo = parseGeographicInfo(props, category);
                    marker.category = category;
                    marker.provincia = geoInfo.provincia;
                    marker.comune = geoInfo.comune;
                    marker.props = props;

                    marker.addListener("click", () => {
                        displayFeatureDetails(props, category);
                    });

                    markers.push(marker);
                    tempMarkers.push(marker);
                } catch (err) {
                    console.error("Error rendering single CSV row:", err);
                }
            });

            if (clusterers[category]) {
                clusterers[category].addMarkers(tempMarkers);
            }
            
            // Sync current items with our dynamic list view
            allFacilities = markers;
            filterAll();
        }

        // CENTRATURA COMUNE CERTIFICATA (CALCOLA IL BARICENTRO REALE DEI PRESIDI DEL COMUNE!)
        function selectComuneSuggestion(comuneUpper, provCode) {

            // Se è un capoluogo di provincia, usa le coordinate del centro cittadino (non della provincia!)
            let targetLat = null, targetLng = null, targetZoom = 13.5;
            const cityMarkers = markers.filter(m => m.comune === comuneUpper);

                targetLat = c.lat;
                targetLng = c.lng;

                cityMarkers.forEach(m => {
                    sumLat += m.props.lat;
                    sumLng += m.props.lng;

                targetLng = sumLng / cityMarkers.length;

        // GEOLOCALIZZAZIONE ED INQUADRATURA TRAMITE BARRA DI RICERCA TESTUALE (MOTORE GERARCHICO ISTAT + GOOGLE GEOCODER)
        function geocodeAddressSearch() {
            const searchText = document.getElementById("free-search").value.trim();
            if (!searchText) {
                alert("Digita un comune, un indirizzo o il nome di un centro prima di cliccare su Cerca.");
                return;
            }
            const qUp = searchText.toUpperCase().replace(/\s+/g, " ");

            // LIVELLO 1: È il nome esatto di un Comune presente nel database o di un Capoluogo Lombardo?
            if (provinceNamesMap[qUp]) {
                selectComuneSuggestion(qUp, provinceNamesMap[qUp]);
                return;
            }
            const exactComuneMarker = markers.find(m => m.comune === qUp);
            if (exactComuneMarker) {
                selectComuneSuggestion(qUp, exactComuneMarker.provincia);
                return;
            }

            // LIVELLO 2: È il nome di un Centro CAV o Ospedale?
            const exactFacility = markers.find(m => (m.props.name || "").toUpperCase() === qUp)
                               || markers.find(m => m.category === 'CAV' && (m.props.name || "").toUpperCase().includes(qUp));
            if (exactFacility && qUp.length >= 4 && !qUp.startsWith("VIA ") && !qUp.startsWith("PIAZZA ") && !qUp.startsWith("CORSO ") && !qUp.startsWith("VIALE ")) {
                selectSuggestion(exactFacility.props.name);
                return;
            }

            // LIVELLO 3: Geocodifica Indirizzo / Via / Località (Google Maps Geocoder nativo -> fallback Nominatim City-First)
            const searchBtn = document.querySelector("button[onclick='geocodeAddressSearch()']");
            const originalText = searchBtn ? searchBtn.textContent : "Cerca";
            if (searchBtn) {
                searchBtn.textContent = "⏳";
                searchBtn.disabled = true;
            }

            function applyGeocodedPoint(lat, lon) {
                const searchLatLng = { lat: lat, lng: lon };
                referencePoint = { lat: lat, lng: lon, isUserLocated: true };
                switchTab('map');
                map.panTo(searchLatLng);
                map.setZoom(14.0);

                clearSearchInput();

                if (window.userMarker) {
                    window.userMarker.setPosition(searchLatLng);
                } else {
                    window.userMarker = new google.maps.Marker({
                        position: searchLatLng,
                        map: map,
                        title: "Posizione Cercata",
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            fillColor: "#4CAF50",
                            fillOpacity: 1.0,
                            scale: 9,
                            strokeColor: "#FFFFFF",
                            strokeWeight: 2.5
                        }
                    });
                }
                filterAll();
            }

            const url = `https://nominatim.openstreetmap.org/search?format=json&limit=6&q=${encodeURIComponent(searchText + ", Lombardia, Italia")}`;
            fetch(url)
            .then(response => {
                if (!response.ok) throw new Error("Errore di rete");
                return response.json();
            })
            .then(data => {
                if (data && data.length > 0) {
                    // BUGFIX VARESE->COMERIO: Scarta sempre i centroidi provinciali ('county'/'state') se esiste il Comune/Città/Via reale!
                    const best = data.find(r => r.addresstype !== "county" && r.addresstype !== "state" && r.addresstype !== "region") || data[0];
                    applyGeocodedPoint(parseFloat(best.lat), parseFloat(best.lon));
                } else if (window.google && google.maps && google.maps.Geocoder) {
                    const geocoder = new google.maps.Geocoder();
                    geocoder.geocode({
                        address: searchText + ", Lombardia, Italia",
                        bounds: new google.maps.LatLngBounds({ lat: 44.6, lng: 8.4 }, { lat: 46.7, lng: 11.5 })
                    }, (results, status) => {
                        if (status === "OK" && results && results[0]) {
                            const loc = results[0].geometry.location;
                            applyGeocodedPoint(loc.lat(), loc.lng());
                        } else {
                            alert("Impossibile trovare la località cercata. Inserisci un comune, via o centro lombardo valido.");
                        }
                    });
                } else {
                    alert("Impossibile trovare la località cercata. Inserisci un comune, via o centro lombardo valido.");
                }
            })
            .catch(err => {
                console.error("Geocoding fetch error:", err);
                alert("Si è verificato un errore durante la ricerca geografica. Riprova tra pochi istanti.");
            })
            .finally(() => {
                if (searchBtn) {
                    searchBtn.textContent = originalText;
                    searchBtn.disabled = false;
                }
            });
        }

        // MOTORE DI RICERCA IBRIDO CON COINCIDENZE COMPATTE AUTOCOMPLETE (STILE GOOGLE MAPS!)
        function onSearchInput(value) {
            const suggestionsDiv = document.getElementById("search-suggestions");
            const clearBtn = document.getElementById("clear-search-btn");
            if (clearBtn) {
                if (value && value.trim().length > 0) {
                    clearBtn.classList.remove("hidden");
                    clearBtn.classList.add("flex");
                } else {
                    clearBtn.classList.add("hidden");
                    clearBtn.classList.remove("flex");
                }
            }
            if (!suggestionsDiv) return;

            const query = value.toUpperCase().trim();
            
            // Applica comunque il filtraggio testi sulla mappa ed elenco di default
            filterAll();

            if (!query) {
                suggestionsDiv.classList.add("hidden");
                suggestionsDiv.innerHTML = "";
                return;
            }

            // 1. Cerca Comuni ISTAT corrispondenti (es. "Varese", "Busto Arsizio", "Gallarate")
            const comuniMap = new Map();
            for (let i = 0; i < markers.length; i++) {
                const m = markers[i];
                const com = (m.comune || "").toUpperCase();
                if (com && com.includes(query)) {
                    if (!comuniMap.has(com)) {
                        comuniMap.set(com, { comune: com, provincia: m.provincia, count: 0, cavCount: 0 });
                    }
                    const entry = comuniMap.get(com);
                    entry.count++;
                    if (m.category === 'CAV') entry.cavCount++;
                }
            }
            const comuniMatches = Array.from(comuniMap.values()).sort((a, b) => {
                const aExact = a.comune === query ? 0 : (a.comune.startsWith(query) ? 1 : 2);
                const bExact = b.comune === query ? 0 : (b.comune.startsWith(query) ? 1 : 2);
                if (aExact !== bExact) return aExact - bExact;
                return b.count - a.count;
            }).slice(0, 2);

            // 2. Cerca Presidi con Ranking Intelligente (Priorità a Centri CAV e Ospedali + Match sul Nome!)
            const scoredMatches = [];
            for (let i = 0; i < markers.length; i++) {
                const marker = markers[i];
                const name = (marker.props.name || "").toUpperCase();
                const addr = (marker.props.indirizzo || "").toUpperCase();
                const com = (marker.comune || "").toUpperCase();

                if (name.includes(query) || addr.includes(query) || com.includes(query)) {
                    let score = 0;
                    if (name.startsWith(query)) score += 100;
                    else if (name.includes(query)) score += 60;
                    if (com === query) score += 50;
                    else if (com.startsWith(query)) score += 30;
                    if (addr.includes(query)) score += 20;
                    if (marker.category === "CAV") score += 90;
                    else if (marker.category === "SANITA") score += 45;
                    scoredMatches.push({ marker, score });
                }
            }
            scoredMatches.sort((a, b) => b.score - a.score);

        // FUNZIONE DI PARSING GEOGRAFICO CERTIFICATA (PRIORITÀ ALLE COLONNE DEDICATE 'COMUNE' E 'PROVINCIA')
        function parseGeographicInfo(props, category) {
            let comune = (props.comune || "").trim();
            let provincia = (props.provincia || "").trim().toUpperCase();
            if (provincia === "MA") provincia = "MN"; // Fix codifica Mantova

            if (comune && provincia) {
                return { comune: comune.toUpperCase(), provincia: provincia };
            }

            const indirizzo = props.indirizzo || "";
            if (indirizzo && indirizzo !== "Indirizzo non disponibile") {
                const provMatch = indirizzo.match(/\(([A-Z]{2})\)/);
                if (provMatch && !provincia) {
                    provincia = provMatch[1] === "MA" ? "MN" : provMatch[1];
                }
                const capCityMatch = indirizzo.match(/\b(\d{5})\s*,?\s*([A-Za-zÀ-ÿ'’\-\s]+?)\s*\([A-Z]{2}\)/);
                if (capCityMatch && !comune) {
                    comune = capCityMatch[2].trim();
                }
            }

            return { 
                comune: (comune || "").toUpperCase(), 
                provincia: (provincia || "").toUpperCase() 
            };
        }

        // MOTORE FISICO TOUCH SWIPE-TO-DISMISS COL POLLICE PER IL BOTTOM SHEET
        (function initBottomSheetSwipe() {
            document.addEventListener("DOMContentLoaded", () => {
                const sheet = document.getElementById("bottom-sheet");
                const handle = document.getElementById("sheet-drag-handle");
                const content = document.getElementById("sheet-content");
                if (!sheet || !handle) return;

                let startY = 0;
                let currentDeltaY = 0;
                let isDragging = false;

                function onTouchStart(e) {
                    if (!e.touches || e.touches.length !== 1) return;
                    // Se il tocco parte dal contenuto interno, attiva lo swipe solo se siamo in cima allo scroll
                    if (content && content.contains(e.target) && content.scrollTop > 2) return;
                    startY = e.touches[0].clientY;
                    currentDeltaY = 0;
                    isDragging = true;
                    sheet.style.transition = "none";
                }

                function onTouchMove(e) {
                    if (!isDragging || !e.touches || e.touches.length !== 1) return;
                    const deltaY = e.touches[0].clientY - startY;
                    if (deltaY > 0) {
                        currentDeltaY = deltaY;
                        sheet.style.transform = `translateY(${deltaY}px)`;
                        if (e.cancelable) e.preventDefault();
                    } else {
                        currentDeltaY = 0;
                        sheet.style.transform = "translateY(0px)";
                    }
                }

                function onTouchEnd() {
                    if (!isDragging) return;
                    isDragging = false;
                    sheet.style.transition = "transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1)";
                    if (currentDeltaY > 55) {
                        closeBottomSheet();
                    } else {
                        sheet.style.transform = "";
                    }
                    currentDeltaY = 0;
                }

                sheet.addEventListener("touchstart", onTouchStart, { passive: true });
                sheet.addEventListener("touchmove", onTouchMove, { passive: false });
                sheet.addEventListener("touchend", onTouchEnd, { passive: true });
            });
        })();

                                <div class="flex items-center gap-1.5 text-gray-600 mt-1">
                                    <span class="material-symbols-outlined text-[15px] text-primary shrink-0">location_on</span>
                                    <span class="text-xs truncate">${escapeHTML(facility.props.indirizzo)}</span>
                                </div>
                                ${facility.props.orari ? `
                                    <div class="flex items-center gap-1.5 text-gray-500 mt-1">
                                        <span class="material-symbols-outlined text-[15px] text-emerald-600 shrink-0">schedule</span>
                                        <span class="text-[0.7rem] font-medium truncate">${escapeHTML(facility.props.orari)}</span>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                        
                        <!-- Action row (Call + Map Focus + Details) -->
                        <div class="grid grid-cols-12 gap-2 pt-1">
                            <a aria-label="${escapeHTML(phoneLabel)}" class="col-span-6 h-11 rounded-2xl bg-primary hover:bg-magenta-dark active:scale-[0.98] text-white font-extrabold text-xs flex items-center justify-center gap-1.5 shadow-sm transition-transform px-2.5 truncate" href="${escapeHTML(callHref)}">
                                <span class="material-symbols-outlined text-[17px] shrink-0" style="font-variation-settings: 'FILL' 1;">call</span>
                                <span class="truncate">${escapeHTML(phoneLabel)}</span>
                            </a>
                            <button class="col-span-3 h-11 rounded-2xl bg-blue-50 hover:bg-blue-100 active:scale-[0.98] text-secondary font-extrabold text-xs flex items-center justify-center gap-1 transition-all cursor-pointer" onclick="focusOnMap(${facility.props.lat}, ${facility.props.lng}, '${encodedProps}', '${facility.category}')" type="button" title="Inquadra sulla mappa">
                                <span class="material-symbols-outlined text-[16px]">my_location</span>
                                <span>Mappa</span>
                            </button>
                            <button class="col-span-3 h-11 rounded-2xl bg-gray-100 hover:bg-gray-200 active:scale-[0.98] text-gray-800 font-extrabold text-xs flex items-center justify-center gap-0.5 transition-all cursor-pointer" onclick="displayFeatureDetails(JSON.parse(decodeURIComponent('${encodedProps}')), '${facility.category}')" type="button">
                                <span>Info</span>
                                <span class="material-symbols-outlined text-[15px]">arrow_forward</span>
                            </button>
                        </div>
                    </article>
                `;
            });

            if (sourceItems.length > listRenderLimit) {
                const remaining = sourceItems.length - listRenderLimit;
                html += `
                    <button onclick="loadMoreListItems()" class="w-full h-11 mt-2 rounded-full bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-extrabold text-xs shadow-sm transition-all cursor-pointer">
                        Mostra altri presidi (${remaining} rimanenti)
                    </button>
                `;
            }

            listContainer.innerHTML = `<div class="flex flex-col gap-3 py-2">${html}</div>`;
        }

        // FILTRAGGIO ED INCROCIO DATI GENERALE
        function filterAll() {
            closeBottomSheet();
            
            const freeSearchInput = document.getElementById("free-search");
            const selectProvinciaInput = document.getElementById("select-provincia");
            const selectComuneInput = document.getElementById("select-comune");
            
            const textSearch = freeSearchInput ? freeSearchInput.value.toUpperCase().trim() : "";
            const selProvincia = selectProvinciaInput ? selectProvinciaInput.value : "";
            const selComune = selectComuneInput ? selectComuneInput.value : "";

            for (const key of Object.keys(clusterers)) {
                if (clusterers[key]) clusterers[key].clearMarkers();
            }
            
            const activeMarkersByLayer = { 'CAV': [], 'SANITA': [], 'FORZE_ORDINE': [] };
            const visibleFacilities = [];
            
            markers.forEach(marker => {
                try {
                    const categoryActive = layers[marker.category].active;
                    const matchesProvincia = !selProvincia || marker.provincia === selProvincia;
                    const matchesComune = !selComune || marker.comune === selComune;
                    
                    let matchesText = true;
                    if (textSearch) {
                        const name = (marker.props.name || "").toUpperCase();
                        const addr = (marker.props.indirizzo || "").toUpperCase();
                        const com = (marker.comune || "").toUpperCase();
                        matchesText = name.includes(textSearch) || addr.includes(textSearch) || com.includes(textSearch);
                    }
                    
                    if (categoryActive && matchesProvincia && matchesComune && matchesText) {
                        marker.setMap(map);
                        if (activeMarkersByLayer[marker.category]) {
                            activeMarkersByLayer[marker.category].push(marker);
                        }
                        visibleFacilities.push(marker);
                    } else {
                        marker.setMap(null);
                    }
                } catch (err) {
                    console.error("Error filtering single marker:", err);
                }
            });
            
            for (const key of Object.keys(clusterers)) {
                if (clusterers[key] && activeMarkersByLayer[key]) {
                    clusterers[key].addMarkers(activeMarkersByLayer[key]);
                }
            }

            // Aggiorna i contatori live sulle 3 pillole filtro (mostrando sempre i totali matching per provincia/ricerca anche se un layer è spento!)
            const countByCat = { 'CAV': 0, 'SANITA': 0, 'FORZE_ORDINE': 0 };
            markers.forEach(m => {
                const matchesProvincia = !selProvincia || m.provincia === selProvincia;
                const matchesComune = !selComune || m.comune === selComune;
                let matchesText = true;
                if (textSearch) {
                    const name = (m.props.name || "").toUpperCase();
                    const addr = (m.props.indirizzo || "").toUpperCase();
                    const com = (m.comune || "").toUpperCase();
                    matchesText = name.includes(textSearch) || addr.includes(textSearch) || com.includes(textSearch);
                }
                if (matchesProvincia && matchesComune && matchesText && countByCat[m.category] !== undefined) {
                    countByCat[m.category]++;
                }
            });
            const countCavEl = document.getElementById("count-cav");
            const countPsEl = document.getElementById("count-ps");
            const countPolEl = document.getElementById("count-police");
            if (countCavEl) countCavEl.textContent = countByCat['CAV'];
            if (countPsEl) countPsEl.textContent = countByCat['SANITA'];
            if (countPolEl) countPolEl.textContent = countByCat['FORZE_ORDINE'];

            // Sync with dynamic list view!
            rebuildListView(visibleFacilities);
        }

        // SELEZIONE RAPIDA PROVINCIA DAI CHIP IN CIMA ALLA MAPPA (UI/UX PRO MAX)
        function quickSelectProvince(provCode) {
            const selProv = document.getElementById("select-provincia");
            if (!selProv) return;
            if (selProv.value === provCode) {
                resetFilters();
            } else {
                selProv.value = provCode;
                onProvinciaChange();
            }
        }

        // CAMBIO PROVINCIA
        function onProvinciaChange() {
            const selProvincia = document.getElementById("select-provincia").value;
            const selectComune = document.getElementById("select-comune");
            
            selectComune.innerHTML = '<option value="">Comune (Tutti)</option>';
            selectComune.value = "";
            
            if (selProvincia) {
                selectComune.disabled = false;
                
                const comuniUnici = new Set();
                markers.forEach(marker => {
                    if (marker.provincia === selProvincia && marker.comune) {
                        comuniUnici.add(marker.comune);
                    }
                });
                
                const comuniOrdinati = Array.from(comuniUnici).sort();
                comuniOrdinati.forEach(comune => {
                    if (comune && comune !== "INDIRIZZO NON DISPONIBILE") {
                        const opt = document.createElement("option");
                        opt.value = comune;
                        opt.textContent = comune.charAt(0) + comune.slice(1).toLowerCase();
                        selectComune.appendChild(opt);
                    }
                });
                
                const centroid = provinceCentroids[selProvincia];
                if (centroid && map) {
                    referencePoint = { lat: centroid.lat, lng: centroid.lng, isUserLocated: true };
                    map.panTo({ lat: centroid.lat, lng: centroid.lng });
                    map.setZoom(centroid.zoom);
                }
            } else {
                selectComune.disabled = true;
            }
            
            filterAll();
        }

        // CAMBIO COMUNE
        function onComuneChange() {
            const selComune = document.getElementById("select-comune").value;
            
            if (selComune && map) {
                const markerComune = markers.find(m => m.comune === selComune);
                if (markerComune) {
                    referencePoint = { lat: markerComune.props.lat, lng: markerComune.props.lng, isUserLocated: true };
                    map.panTo(markerComune.getPosition());
                    map.setZoom(13.5);
                }
            }
            
            filterAll();
        }

        // RESET FILTRI
        function resetFilters() {
            document.getElementById("free-search").value = "";
            document.getElementById("select-provincia").value = "";
            
            const selectComune = document.getElementById("select-comune");
            selectComune.innerHTML = '<option value="">Comune (Tutti)</option>';
            selectComune.value = "";
            selectComune.disabled = true;
            
            for (const key of Object.keys(layers)) {
                layers[key].active = true;
                const pillId = `pill-${key === 'CAV' ? 'cav' : key === 'SANITA' ? 'ps' : 'police'}`;
                const pillElement = document.getElementById(pillId);
                if (pillElement) {
                    if (key === 'CAV') pillElement.className = "flex items-center justify-center gap-1 py-1.5 px-1 rounded-full bg-primary text-white transition-all shadow-sm";
                    else if (key === 'SANITA') pillElement.className = "flex items-center justify-center gap-1 py-1.5 px-1 rounded-full bg-tertiary text-white transition-all shadow-sm";
                    else if (key === 'FORZE_ORDINE') pillElement.className = "flex items-center justify-center gap-1 py-1.5 px-1 rounded-full bg-secondary text-white transition-all shadow-sm";
                }
            }
            
            if (map) {
                map.panTo({ lat: 45.67, lng: 9.60 });
                map.setZoom(8.5);
            }
            
            filterAll();
            
            const filtersCard = document.getElementById("advanced-filters-card");
            if (filtersCard) {
                filtersCard.classList.remove("open");
                filtersCard.style.display = "none";
            }
            const filterBtn = document.getElementById("expand-filters-btn");
            if (filterBtn) filterBtn.classList.remove("active");
        }

        // GEOLOCALIZZAZIONE UTENTE MANUALE
        function geolocalizeUser() {
            if (!navigator.geolocation) {
                alert("La geolocalizzazione non è supportata dal tuo browser.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const userLatLng = { lat: lat, lng: lon };
                    referencePoint = { lat: lat, lng: lon, isUserLocated: true };

                    if (window.userMarker) {
                        window.userMarker.setPosition(userLatLng);
                    } else {
                        window.userMarker = new google.maps.Marker({
                            position: userLatLng,
                            map: map,
                            title: "Tu sei qui",
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                fillColor: "#4CAF50",
                                fillOpacity: 1.0,
                                scale: 9,
                                strokeColor: "#FFFFFF",
                                strokeWeight: 2.5
                            }
                        });
                    }

                    if (map) {
                        map.panTo(userLatLng);
                        map.setZoom(14.5);
                    }
                    filterAll();
                },
                (error) => {
                    alert("Impossibile rilevare la tua posizione. Verifica di aver concesso i permessi GPS al tuo browser.");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
    </script>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mappa Antiviolenza Lombardia - Servizi di Supporto e Pronto Intervento</title>
    <style>
        :root {
            --primary: #c2185b;
            --primary-dark: #880e4f;
            --secondary: #1976d2;
            --danger: #d32f2f;
            --success: #388e3c;
            --dark: #212121;
            --light: #f5f5f5;
            --white: #ffffff;
            --border-radius: 16px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            font-family: var(--font-family);
            background-color: var(--light);
            color: var(--dark);
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* MAPPA FULL SCREEN */
        #map {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* FLOAT HEADER (Barra di sicurezza superiore fluttuante) */
        .floating-header {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 8px 10px 8px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .header-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-subtitle {
            font-size: 0.75rem;
            color: #666;
        }

        .quick-exit-btn {
            background-color: var(--danger);
            color: var(--white);
            border: none;
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: 800;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(211, 47, 47, 0.35);
            transition: transform 0.1s;
        }

        .quick-exit-btn:active {
            transform: scale(0.95);
        }

        /* FILTRI E PANNELLO DI RICERCA AVANZATA SUL LATO SINISTRO (RESPONSIVO) */
        .side-panel {
            position: fixed;
            top: 85px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            width: calc(100% - 30px);
            max-width: 360px;
            max-height: calc(100vh - 110px);
            overflow-y: auto;
            scrollbar-width: none;
        }

        .side-panel::-webkit-scrollbar {
            display: none;
        }

        /* BLOCCO DELLA BARRA DI RICERCA ED ELENCO TENDINE (Ispirato a NonSeiDaSola) */
        .search-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 12px 14px 12px 35px;
            border-radius: 25px;
            border: 1.5px solid #ddd;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            width: 16px;
            height: 16px;
            fill: #777;
        }

        .select-group {
            display: flex;
            gap: 8px;
        }

        .custom-select {
            flex: 1;
            padding: 10px 12px;
            border-radius: 20px;
            border: 1.5px solid #ddd;
            font-size: 0.8rem;
            font-weight: bold;
            color: #444;
            outline: none;
            background-color: var(--white);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .custom-select:focus {
            border-color: var(--primary);
        }

        .reset-btn {
            background-color: #f5f5f5;
            color: #555;
            border: 1.5px solid #ddd;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .reset-btn:hover {
            background-color: #eee;
        }

        /* PILLOLE DI LIVELLO (Categorie) */
        .filter-group-vertical {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-pill-vertical {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1.5px solid #eee;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #444;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .filter-pill-vertical.active.cav {
            background-color: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        .filter-pill-vertical.active.ps {
            background-color: var(--danger);
            color: var(--white);
            border-color: var(--danger);
        }

        .filter-pill-vertical.active.police {
            background-color: var(--secondary);
            color: var(--white);
            border-color: var(--secondary);
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-cav { background-color: #FF1493; }
        .dot-ps { background-color: #FF0000; }
        .dot-police { background-color: #0000FF; }

        /* BOTTONE GEOLOCALIZZAZIONE FLUTTUANTE (FAB) */
        .geolocate-fab {
            position: fixed;
            bottom: 180px;
            right: 15px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--white);
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: transform 0.1s;
        }

        .geolocate-fab:active {
            transform: scale(0.92);
        }

        .geolocate-fab svg {
            width: 22px;
            height: 22px;
            fill: var(--success);
        }

        /* BOTTOM SHEET RESPONSIVA (Drawer di dettagli) */
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%); /* Nascosta per default */
            width: 100%;
            max-width: 600px;
            background-color: var(--white);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -5px 30px rgba(0,0,0,0.15);
            z-index: 20;
            padding: 20px 20px calc(20px + var(--safe-bottom)) 20px;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 80vh;
            overflow-y: auto;
        }

        .bottom-sheet.open {
            transform: translateX(-50%) translateY(0);
        }

        /* Maniglia del Bottom Sheet */
        .sheet-handle {
            width: 40px;
            height: 5px;
            background-color: #ddd;
            border-radius: 3px;
            margin: -10px auto 15px auto;
        }

        .sheet-close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #eee;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            color: #666;
            font-weight: bold;
        }

        .detail-badge {
            background-color: var(--success);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .detail-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.3;
            margin-bottom: 6px;
            padding-right: 25px;
        }

        .detail-meta {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-divider {
            border-top: 1.5px solid var(--light);
            margin: 15px 0;
        }

        /* BOTTONI D'AZIONE DRAWER */
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            transition: opacity 0.2s;
        }

        .action-btn:active {
            opacity: 0.85;
        }

        .action-btn-call {
            background-color: var(--primary);
            color: var(--white);
        }

        .action-btn-email {
            background-color: var(--white);
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .action-btn-web {
            background-color: var(--white);
            color: var(--secondary);
            border: 2px solid var(--secondary);
        }

        .services-card {
            background-color: var(--light);
            padding: 14px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .services-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .services-list {
            list-style-type: none;
            padding-left: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .services-list li {
            font-size: 0.8rem;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* BOTTOM BANNER INIZIALE */
        .intro-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.12);
            z-index: 10;
            text-align: center;
        }

        .intro-banner p {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .intro-numbers {
            display: flex;
            gap: 8px;
        }

        .intro-num-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* STILI DESKTOP */
        @media (min-width: 900px) {
            .bottom-sheet {
                left: 20px;
                bottom: 20px;
                transform: translateX(-150%);
                width: 360px;
                border-radius: 20px;
                max-height: calc(100vh - 40px);
            }

            .bottom-sheet.open {
                transform: translateX(0);
            }

            .intro-banner {
                left: 20px;
                bottom: 20px;
                transform: translateX(0);
                width: 360px;
            }

            .geolocate-fab {
                bottom: 20px;
                right: 20px;
            }

            .floating-header {
                left: 20px;
                transform: translateX(0);
                width: 360px;
                top: 20px;
            }

            .side-panel {
                left: 20px;
                top: 85px;
                width: 360px;
            }
        }
    </style>
</head>
<body>

    <!-- MAPPA FULL VIEWPORT -->
    <div id="map"></div>

    <!-- FLOAT HEADER -->
    <div class="floating-header">
        <div class="header-info">
            <span class="header-title">Mappa Supporto Donna</span>
            <span class="header-subtitle">Lombardia • Verificata 2026</span>
        </div>
        <button class="quick-exit-btn" onclick="triggerQuickExit()">Uscita Rapida (Esc)</button>
    </div>

    <!-- PANNELLO LATERALE COMPATTO CON BARRA DI RICERCA ED INTERRUTTORI -->
    <div class="side-panel">
        <!-- SEZIONE DI RICERCA COMPLETA (Ispirato a NonSeiDaSola) -->
        <div class="search-card">
            <!-- Barra di ricerca a testo libero -->
            <div class="search-input-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input type="text" id="free-search" class="search-input" placeholder="Cerca per via, comune, provincia..." oninput="filterAll()">
            </div>
            
            <!-- Dropdown di selezione Provincia e Comune -->
            <div class="select-group">
                <select id="select-provincia" class="custom-select" onchange="onProvinciaChange()">
                    <option value="">Provincia (Tutte)</option>
                    <option value="BG">Bergamo (BG)</option>
                    <option value="BS">Brescia (BS)</option>
                    <option value="CO">Como (CO)</option>
                    <option value="CR">Cremona (CR)</option>
                    <option value="LC">Lecco (LC)</option>
                    <option value="LO">Lodi (LO)</option>
                    <option value="MB">Monza e Brianza (MB)</option>
                    <option value="MI">Milano (MI)</option>
                    <option value="MN">Mantova (MN)</option>
                    <option value="PV">Pavia (PV)</option>
                    <option value="SO">Sondrio (SO)</option>
                    <option value="VA">Varese (VA)</option>
                </select>
                
                <select id="select-comune" class="custom-select" disabled onchange="onComuneChange()">
                    <option value="">Comune (Tutti)</option>
                </select>
            </div>
            
            <button class="reset-btn" onclick="resetFilters()">Resetta Ricerca</button>
        </div>

        <!-- PILLOLE INTERRUTTORI CATEGORIA -->
        <div class="filter-group-vertical">
            <div class="filter-pill-vertical active cav" id="pill-cav" onclick="toggleCategory('CAV')">
                <span class="color-dot dot-cav"></span> 💗 Centri Antiviolenza
            </div>
            <div class="filter-pill-vertical active ps" id="pill-ps" onclick="toggleCategory('SANITA')">
                <span class="color-dot dot-ps"></span> 🚑 Pronto Soccorso
            </div>
            <div class="filter-pill-vertical active police" id="pill-police" onclick="toggleCategory('FORZE_ORDINE')">
                <span class="color-dot dot-police"></span> 🚓 Forze dell'Ordine
            </div>
        </div>
    </div>

    <!-- FLOAT ACTION BUTTON GEOLOCATE (FAB) -->
    <button class="geolocate-fab" id="geolocate-btn" onclick="geolocalizeUser()" title="Trova la mia posizione">
        <svg viewBox="0 0 24 24">
            <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
        </svg>
    </button>

    <!-- INTRO BANNER (Mostrato all'avvio) -->
    <div class="intro-banner" id="intro-banner">
        <p>Cerca per comune, via o provincia sul pannello, seleziona un punto sulla mappa, o clicca sul tasto GPS verde a destra per trovare le strutture vicine.</p>
        <div class="intro-numbers">
            <a href="tel:1522" class="intro-num-btn" style="background-color: var(--primary);">📞 1522 CAV</a>
            <a href="tel:112" class="intro-num-btn" style="background-color: var(--secondary);">🚓 112 Emergenza</a>
        </div>
    </div>

    <!-- BOTTOM SHEET (DRAWER DETTAGLI) -->
    <div class="bottom-sheet" id="bottom-sheet">
        <div class="sheet-handle"></div>
        <button class="sheet-close-btn" onclick="closeBottomSheet()">✕</button>
        
        <div id="sheet-content">
            <!-- Popolato dinamicamente da JavaScript cliccando su un marker -->
        </div>
    </div>

    <!-- LIBRERIE GOOGLE MAPS E MARKER CLUSTERER -->
    <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=***&callback=initMap" async defer></script>

    <script>
        // CONFIGURAZIONE GLOBALE MAPPA
        let map;
        let markers = [];
        let infoWindow;
        let clusterers = {};
        
        // Categorie caricate
        const layers = {
            'CAV': { file: 'data/cav.geojson', active: true, color: '#FF1493' },
            'SANITA': { file: 'data/pronto_soccorso.geojson', active: true, color: '#FF0000' },
            'FORZE_ORDINE': { file: 'data/forze_ordine.geojson', active: true, color: '#0000FF' }
        };

        // Coordinate dei centroidi delle province lombarde per centratura mappa
        const provinceCentroids = {
            "BG": { lat: 45.6983, lng: 9.6773, zoom: 10 },
            "BS": { lat: 45.5416, lng: 10.2118, zoom: 10 },
            "CO": { lat: 45.8081, lng: 9.0852, zoom: 10.5 },
            "CR": { lat: 45.1333, lng: 10.0333, zoom: 10 },
            "LC": { lat: 45.8566, lng: 9.3977, zoom: 11 },
            "LO": { lat: 45.3167, lng: 9.5000, zoom: 11 },
            "MB": { lat: 45.5845, lng: 9.2735, zoom: 11.5 },
            "MI": { lat: 45.4642, lng: 9.1904, zoom: 10.5 },
            "MN": { lat: 45.1500, lng: 10.7833, zoom: 10 },
            "PV": { lat: 45.1850, lng: 9.1608, zoom: 10 },
            "SO": { lat: 46.1689, lng: 9.8731, zoom: 9.5 },
            "VA": { lat: 45.8196, lng: 8.8250, zoom: 10.5 }
        };

        // PIN SVG PERSONALIZZATI AD ALTA DEFINIZIONE CON ICONA INTERNA
        const svgCAV = (color) => 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 30" width="34" height="42">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 9.3 12 18 12 18s12-8.7 12-18c0-6.63-5.37-12-12-12z" fill="${color}" stroke="#FFFFFF" stroke-width="1.5"/>
                <path d="M12 5.5l-5 4.5v6.5h3.5v-4h3v4h3.5V10z" fill="#FFFFFF"/>
            </svg>
        `);

        const svgProntoSoccorso = (color) => 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 30" width="34" height="42">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 9.3 12 18 12 18s12-8.7 12-18c0-6.63-5.37-12-12-12z" fill="${color}" stroke="#FFFFFF" stroke-width="1.5"/>
                <path d="M10.5 6.5h3v4H17.5v3H13.5v4h-3v-4H6.5v-3h4z" fill="#FFFFFF"/>
            </svg>
        `);

        const svgForzeOrdine = (color) => 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 30" width="34" height="42">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 9.3 12 18 12 18s12-8.7 12-18c0-6.63-5.37-12-12-12z" fill="${color}" stroke="#FFFFFF" stroke-width="1.5"/>
                <path d="M12 5.5l5 2v4.5c0 3.11-2.14 6.01-5 6.75-2.86-.74-5-3.64-5-6.75V7.5z" fill="#FFFFFF"/>
            </svg>
        `);

        // INIZIALIZZAZIONE DELLA MAPPA (STILE SILVER MINIMALIST SENZA POI COMMERCIALI)
        function initMap() {
            const lombardiaCenter = { lat: 45.67, lng: 9.60 };
            
            const customMapStyle = [
                { "featureType": "poi", "elementType": "all", "stylers": [{ "visibility": "off" }] },
                { "featureType": "transit.station", "elementType": "all", "stylers": [{ "visibility": "off" }] },
                { "featureType": "road", "elementType": "labels.icon", "stylers": [{ "visibility": "off" }] },
                { "featureType": "all", "elementType": "geometry", "stylers": [{ "saturation": -15 }, { "lightness": 10 }] }
            ];

            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 8.5,
                center: lombardiaCenter,
                styles: customMapStyle,
                mapTypeControl: false,
                streetViewControl: false,
                fullscreenControl: false,
                zoomControl: false
            });

            infoWindow = new google.maps.InfoWindow();

            // Inizializza i clusterers per ciascun livello per garantire performance fulminee a 60 FPS
            clusterers = {
                'CAV': new markerClusterer.MarkerClusterer({ map, markers: [] }),
                'SANITA': new markerClusterer.MarkerClusterer({ map, markers: [] }),
                'FORZE_ORDINE': new markerClusterer.MarkerClusterer({ map, markers: [] })
            };

            loadAllLayers();
        }

        // CARICAMENTO DEI LAYER GEOJSON
        async function loadAllLayers() {
            for (const [key, config] of Object.entries(layers)) {
                try {
                    const response = await fetch(config.file);
                    const geojson = await response.json();
                    renderFeatures(geojson, key);
                } catch (e) {
                    console.error(`Error loading layer ${key}:`, e);
                }
            }
        }

        // FUNZIONE INTELLIGENTE DI ESTRAZIONE INFORMAZIONI GEOGRAFICHE DAI DATI (ANCHE DA OSM)
        function parseGeographicInfo(props, category) {
            let comune = props.comune || "";
            let provincia = props.provincia || "";
            const indirizzo = props.indirizzo || "";
            
            if (indirizzo && indirizzo !== "Indirizzo non disponibile") {
                const parts = indirizzo.split(",").map(p => p.trim());
                if (parts.length >= 1) {
                    const last = parts[parts.length - 1];
                    const provMatch = last.match(/\(([A-Z]{2})\)/);
                    if (provMatch) {
                        provincia = provMatch[1];
                        if (parts.length >= 2) {
                            comune = parts[parts.length - 2];
                        }
                    } else {
                        comune = last;
                        
                        // Inferisci provincia da CAP
                        const zipMatch = indirizzo.match(/\b(\d{5})\b/);
                        if (zipMatch) {
                            const zip = zipMatch[1];
                            if (zip.startsWith("25")) provincia = "BS";
                            else if (zip.startsWith("24")) provincia = "BG";
                            else if (zip.startsWith("21")) provincia = "VA";
                            else if (zip.startsWith("22")) provincia = "CO";
                            else if (zip.startsWith("27")) provincia = "PV";
                            else if (zip.startsWith("46")) provincia = "MN";
                            else if (zip.startsWith("238") || zip.startsWith("239")) provincia = "LC";
                            else if (zip.startsWith("230") || zip.startsWith("231")) provincia = "SO";
                            else if (zip.startsWith("268") || zip.startsWith("269")) provincia = "LO";
                            else if (zip.startsWith("260") || zip.startsWith("261")) provincia = "CR";
                            else if (zip.startsWith("208") || zip.startsWith("209")) provincia = "MB";
                            else if (zip.startsWith("200") || zip.startsWith("201")) provincia = "MI";
                        }
                    }
                }
            }
            
            // Fallback provincia da titolo
            if (!provincia) {
                const title = (props.name || "").toUpperCase();
                if (title.includes("MILANO")) provincia = "MI";
                else if (title.includes("BRESCIA")) provincia = "BS";
                else if (title.includes("BERGAMO")) provincia = "BG";
                else if (title.includes("VARESE")) provincia = "VA";
                else if (title.includes("COMO")) provincia = "CO";
                else if (title.includes("PAVIA")) provincia = "PV";
                else if (title.includes("MONZA")) provincia = "MB";
                else if (title.includes("LECCO")) provincia = "LC";
                else if (title.includes("LODI")) provincia = "LO";
                else if (title.includes("CREMONA")) provincia = "CR";
                else if (title.includes("MANTOVA")) provincia = "MN";
                else if (title.includes("SONDRIO")) provincia = "SO";
            }
            
            if (!comune) {
                comune = (props.name || "").trim();
            }
            
            // Pulisci e normalizza comune
            comune = comune.replace(/\d+/g, '').replace(/[\(\)]/g, '')
                          .replace(/SPORTELLO DI/gi, "")
                          .replace(/CENTRO ANTIVIOLENZA/gi, "")
                          .replace(/STAZIONE CARABINIERI/gi, "")
                          .replace(/PRONTO SOCCORSO/gi, "")
                          .replace(/OSPEDALE/gi, "")
                          .replace(/PRESIDIO OSPEDALIERO/gi, "")
                          .replace(/COMANDO/gi, "")
                          .trim();
                          
            if (comune.includes(",")) {
                comune = comune.split(",")[0].trim();
            }
            
            return { comune: comune.toUpperCase(), provincia: provincia.toUpperCase() };
        }

        // RENDERING DELLE FEATURES SULLA MAPPA (SEGNAPOSTI DIFFERENZIATI PER COLORE ED ICONA INTERNA)
        function renderFeatures(geojson, category) {
            const tempMarkers = [];
            
            geojson.features.forEach(feature => {
                const coords = feature.geometry.coordinates;
                const latLng = new google.maps.LatLng(coords[1], coords[0]);
                const props = feature.properties;

                let pinColor = layers[category].color;
                if (props.colore_marker) {
                    pinColor = props.colore_marker;
                }

                // Scegli l'icona SVG vettoriale differenziata in base alla categoria
                let customIconUrl = "";
                if (category === "CAV") {
                    customIconUrl = svgCAV(pinColor);
                } else if (category === "SANITA") {
                    customIconUrl = svgProntoSoccorso(pinColor);
                } else if (category === "FORZE_ORDINE") {
                    customIconUrl = svgForzeOrdine(pinColor);
                }

                // Genera il marker personalizzato ad alta definizione
                const marker = new google.maps.Marker({
                    position: latLng,
                    title: props.name,
                    icon: {
                        url: customIconUrl,
                        scaledSize: new google.maps.Size(34, 42),
                        anchor: new google.maps.Point(17, 42)
                    }
                });

                // Associa i metadati per i filtri di ricerca georeferenziati
                const geoInfo = parseGeographicInfo(props, category);
                marker.category = category;
                marker.provincia = geoInfo.provincia;
                marker.comune = geoInfo.comune;
                marker.props = props;

                // CLICK SUL PIN -> APRE IL DRAWER MOBILE (BOTTOM SHEET)
                marker.addListener("click", () => {
                    displayFeatureDetails(props, category);
                });

                markers.push(marker);
                tempMarkers.push(marker);
            });

            // Aggiunge i marker appena generati al rispettivo clusterer di livello (prestazioni fulminee)
            clusterers[category].addMarkers(tempMarkers);
        }

        // MOSTRA I DETTAGLI NEL BOTTOM SHEET (DRAWER MOBILE-FIRST)
        function displayFeatureDetails(props, category) {
            const cleanPhone = (props.telefono || "").replace(/[^0-9+]/g, "");
            const sheetContent = document.getElementById("sheet-content");
            
            // Nasconde il banner introduttivo per massimizzare lo spazio utile
            document.getElementById("intro-banner").style.display = "none";
            
            let badgeText = "🟢 Servizio Verificato";
            let badgeBg = "var(--success)";
            
            if (category === "SANITA") {
                badgeText = "🚑 Soccorso Sanitario d'Emergenza";
                badgeBg = "var(--danger)";
            } else if (category === "FORZE_ORDINE") {
                badgeText = "🚓 Forza dell'Ordine Istituzionale";
                badgeBg = "var(--secondary)";
            }

            // Generazione dell'HTML del drawer
            let html = `
                <span class="detail-badge" style="background-color: ${badgeBg};">${badgeText}</span>
                <h3 class="detail-title">${props.name}</h3>
                <div class="detail-meta">📍 <strong>Indirizzo:</strong> ${props.indirizzo}</div>
            `;

            if (props.orari) {
                html += `<div class="detail-meta">⏰ <strong>Orari:</strong> ${props.orari}</div>`;
            }

            // Pulsanti di contatto giganti e facili da toccare
            html += `<div class="action-group">`;
            
            if (props.telefono && props.telefono !== "112 / 118") {
                html += `
                    <a href="tel:${cleanPhone}" class="action-btn action-btn-call">
                        📞 CHIAMA SUBITO (${props.telefono})
                    </a>
                `;
            } else {
                const numEmergency = (category === "CAV") ? "1522" : "112";
                html += `
                    <a href="tel:${numEmergency}" class="action-btn action-btn-call">
                        📞 CHIAMA EMERGENZA (${numEmergency})
                    </a>
                `;
            }

            if (props.email) {
                html += `
                    <a href="mailto:${props.email}" class="action-btn action-btn-email">
                        ✉️ INVIA UN'E-MAIL
                    </a>
                `;
            }

            if (props.sito_web) {
                html += `
                    <a href="${props.sito_web}" target="_blank" rel="noopener noreferrer" class="action-btn action-btn-web">
                        🌐 VISITA IL SITO WEB
                    </a>
                `;
            }
            
            html += `</div>`;

            // Parole chiave dei servizi strutturate per livello
            html += `
                <div class="services-card">
                    <div class="services-title">Servizi & Note di Sicurezza:</div>
                    <ul class="services-list">
            `;

            if (category === "CAV") {
                html += `
                    <li>🧠 Supporto Psicologico e Psicoterapeutico</li>
                    <li>⚖️ Assistenza Legale e Gratuito Patrocinio</li>
                    <li>🏠 Raccordo e inserimento protetto in Case Rifugio</li>
                    <li>💼 Orientamento lavorativo e autonomia</li>
                    <li>🛡️ Riservatezza assoluta e Anonimato garantito</li>
                `;
            } else if (category === "SANITA") {
                html += `
                    <li>🌸 Percorso assistenziale protetto "Codice Rosa"</li>
                    <li>🩺 Assistenza medica specialistica e reperimento</li>
                    <li>💰 Esente da ticket sanitario per vittime di violenza</li>
                `;
            } else if (category === "FORZE_ORDINE") {
                html += `
                    <li>🛡️ Ricezione denunce e querele per reati di violenza</li>
                    <li>🚨 Attivazione immediata del protocollo "Codice Rosso"</li>
                    <li>🚓 Pronto intervento sul posto in caso di flagranza</li>
                `;
            }

            html += `
                    </ul>
                </div>
            `;

            sheetContent.innerHTML = html;
            
            // Slitta il bottom sheet verso l'alto
            document.getElementById("bottom-sheet").classList.add("open");
        }

        // CHIUDI IL BOTTOM SHEET
        function closeBottomSheet() {
            document.getElementById("bottom-sheet").classList.remove("open");
            document.getElementById("intro-banner").style.display = "block";
        }

        // GESTIONE DEI FILTRI CATEGORIA
        function toggleCategory(category) {
            const pillId = `pill-${category === 'CAV' ? 'cav' : category === 'SANITA' ? 'ps' : 'police'}`;
            const pill = document.getElementById(pillId);
            const isActive = pill.classList.toggle("active");
            
            layers[category].active = isActive;
            filterAll();
        }

        // ALGORITMO DI FILTRAGGIO ED INCROCIO DATI GENERALE (RICERCA + PROVINCIA + COMUNE + CATEGORIA)
        function filterAll() {
            closeBottomSheet();
            
            const textSearch = document.getElementById("free-search").value.toUpperCase().trim();
            const selProvincia = document.getElementById("select-provincia").value;
            const selComune = document.getElementById("select-comune").value;
            
            // Svuota temporaneamente i clusterers per ripopolarli (massime prestazioni)
            for (const key of Object.keys(clusterers)) {
                clusterers[key].clearMarkers();
            }
            
            const activeMarkersByLayer = { 'CAV': [], 'SANITA': [], 'FORZE_ORDINE': [] };
            
            markers.forEach(marker => {
                const categoryActive = layers[marker.category].active;
                
                // Filtro provincia
                const matchesProvincia = !selProvincia || marker.provincia === selProvincia;
                
                // Filtro comune
                const matchesComune = !selComune || marker.comune === selComune;
                
                // Filtro testo libero
                let matchesText = true;
                if (textSearch) {
                    const name = (marker.props.name || "").toUpperCase();
                    const addr = (marker.props.indirizzo || "").toUpperCase();
                    const com = (marker.comune || "").toUpperCase();
                    matchesText = name.includes(textSearch) || addr.includes(textSearch) || com.includes(textSearch);
                }
                
                // Applica lo stato di visibilità sulla mappa
                if (categoryActive && matchesProvincia && matchesComune && matchesText) {
                    marker.setMap(map);
                    activeMarkersByLayer[marker.category].push(marker);
                } else {
                    marker.setMap(null);
                }
            });
            
            // Ripopola i clusterers con gli elementi filtrati
            for (const key of Object.keys(clusterers)) {
                clusterers[key].addMarkers(activeMarkersByLayer[key]);
            }
        }

        // CAMBIO PROVINCIA (Dinamico)
        function onProvinciaChange() {
            const selProvincia = document.getElementById("select-provincia").value;
            const selectComune = document.getElementById("select-comune");
            
            // Svuota e resetta comune
            selectComune.innerHTML = '<option value="">Comune (Tutti)</option>';
            selectComune.value = "";
            
            if (selProvincia) {
                selectComune.disabled = false;
                
                // Trova tutti i comuni unici presenti nei nostri marker della provincia selezionata
                const comuniUnici = new Set();
                markers.forEach(marker => {
                    if (marker.provincia === selProvincia && marker.comune) {
                        comuniUnici.add(marker.comune);
                    }
                });
                
                // Popola il menu ordinando alfabeticamente
                const comuniOrdinati = Array.from(comuniUnici).sort();
                comuniOrdinati.forEach(comune => {
                    if (comune && comune !== "INDIRIZZO NON DISPONIBILE") {
                        const opt = document.createElement("option");
                        opt.value = comune;
                        opt.textContent = comune.charAt(0) + comune.slice(1).toLowerCase();
                        selectComune.appendChild(opt);
                    }
                });
                
                // Sposta e centra la mappa sul centroide della provincia selezionata
                const centroid = provinceCentroids[selProvincia];
                if (centroid) {
                    map.panTo({ lat: centroid.lat, lng: centroid.lng });
                    map.setZoom(centroid.zoom);
                }
            } else {
                selectComune.disabled = true;
            }
            
            filterAll();
        }

        // CAMBIO COMUNE (Centratura mappa sul comune prescelto)
        function onComuneChange() {
            const selComune = document.getElementById("select-comune").value;
            
            if (selComune) {
                // Trova il primo marker corrispondente a quel comune per estrarre le coordinate
                const markerComune = markers.find(m => m.comune === selComune && m.getMap());
                if (markerComune) {
                    map.panTo(markerComune.getPosition());
                    map.setZoom(13.5); // Zoom ravvicinato sul comune
                }
            }
            
            filterAll();
        }

        // RESET COMPLETO DEI FILTRI
        function resetFilters() {
            document.getElementById("free-search").value = "";
            document.getElementById("select-provincia").value = "";
            
            const selectComune = document.getElementById("select-comune");
            selectComune.innerHTML = '<option value="">Comune (Tutti)</option>';
            selectComune.value = "";
            selectComune.disabled = true;
            
            // Riattiva tutte le categorie
            for (const key of Object.keys(layers)) {
                layers[key].active = true;
                const pillId = `pill-${key === 'CAV' ? 'cav' : key === 'SANITA' ? 'ps' : 'police'}`;
                document.getElementById(pillId).classList.add("active");
            }
            
            // Ripristina l'inquadratura originale
            map.panTo({ lat: 45.67, lng: 9.60 });
            map.setZoom(8.5);
            
            filterAll();
        }

        // GEOLOCALIZZAZIONE UTENTE CON ANIMAZIONE FLUIDA E PUNTO GPS VERDE
        function geolocalizeUser() {
            if (!navigator.geolocation) {
                alert("La geolocalizzazione non è supportata dal tuo browser.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const userLatLng = { lat: lat, lng: lon };

                    // Crea o muovi il marker GPS verde dell'utente
                    if (window.userMarker) {
                        window.userMarker.setPosition(userLatLng);
                    } else {
                        window.userMarker = new google.maps.Marker({
                            position: userLatLng,
                            map: map,
                            title: "Tu sei qui",
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                fillColor: "#4CAF50",
                                fillOpacity: 1.0,
                                scale: 9,
                                strokeColor: "#FFFFFF",
                                strokeWeight: 2.5
                            }
                        });
                    }

                    // Centra la mappa con un panning perfetto e applica lo zoom di prossimità
                    map.panTo(userLatLng);
                    map.setZoom(14.5);
                },
                (error) => {
                    alert("Impossibile rilevare la tua posizione. Verifica di aver concesso i permessi GPS al tuo browser.");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
    </script>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mappa Antiviolenza Lombardia - Servizi di Supporto e Pronto Intervento</title>
    <style>
        :root {
            --primary: #c2185b;
            --primary-dark: #880e4f;
            --secondary: #1976d2;
            --danger: #d32f2f;
            --success: #388e3c;
            --dark: #212121;
            --light: #f5f5f5;
            --white: #ffffff;
            --border-radius: 20px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            font-family: var(--font-family);
            background: #e5e5e5;
            color: var(--dark);
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* MAPPA FULL SCREEN */
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* BRAND CARD FLUTTUANTE A SINISTRA (Compatta per evitare conflitti) */
        .brand-card {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 8px 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 100;
            display: flex;
            flex-direction: column;
            border: 1px solid #eee;
            max-width: 50%; /* Impedisce l'overlap */
            pointer-events: none;
        }

        .brand-title {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-subtitle {
            font-size: 0.65rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* TASTO USCITA RAPIDA FLUTTUANTE A DESTRA (Isolato e compatto) */
        .quick-exit-fab {
            position: fixed;
            top: 15px;
            right: 15px;
            background-color: var(--danger);
            color: var(--white);
            border: none;
            padding: 10px 16px;
            font-size: 0.75rem;
            font-weight: 850;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.35);
            z-index: 100;
            transition: transform 0.1s, background-color 0.2s;
        }

        .quick-exit-fab:active {
            transform: scale(0.95);
            background-color: #b71c1c;
        }

        /* CONSOLE SUPERIORE UNIFICATA (Barra di ricerca permanente + filtri a scomparsa) */
        .top-console {
            position: fixed;
            top: 75px; /* Inizia perfettamente sotto la brand card */
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 500px;
            z-index: 90;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* BARRA DI RICERCA COMPATTA E PERMANENTE (Sempre attiva per digitare al volo!) */
        .search-bar-floating {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 6px 10px 6px 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            width: 100%;
        }

        .search-input-wrapper-floating {
            position: relative;
            display: flex;
            align-items: center;
            flex-grow: 1;
            background: #f0f0f0;
            border-radius: 25px;
            padding: 2px 6px 2px 2px;
        }

        .search-input-field {
            border: none;
            background: transparent;
            padding: 8px 8px 8px 32px;
            font-size: 0.85rem;
            font-weight: 500;
            outline: none;
            width: 100%;
            color: var(--dark);
        }

        .search-icon-floating {
            position: absolute;
            left: 12px;
            width: 14px;
            height: 14px;
            fill: #666;
        }

        .search-action-btn-mini {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(194, 24, 91, 0.15);
            transition: background-color 0.2s;
        }

        .search-action-btn-mini:hover {
            background-color: var(--primary-dark);
        }

        /* Pulsante ingranaggio per mostrare/nascondere i filtri Provincia/Comune */
        .expand-filters-btn {
            background: none;
            border: none;
            font-size: 1.15rem;
            cursor: pointer;
            padding: 4px;
            margin-left: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .expand-filters-btn.active {
            transform: rotate(45deg);
        }

        /* Pannello dei filtri avanzati a scomparsa (Provincia, Comune e Reset) */
        .advanced-filters-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            border: 1px solid #eee;
            display: none; /* Si apre solo cliccando sull'ingranaggio */
            flex-direction: column;
            gap: 8px;
        }

        .advanced-filters-card.open {
            display: flex;
        }

        .select-group {
            display: flex;
            gap: 8px;
        }

        .custom-select {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1.5px solid #ddd;
            font-size: 0.8rem;
            font-weight: bold;
            color: #444;
            outline: none;
            background-color: var(--white);
            cursor: pointer;
        }

        .reset-btn {
            background-color: #f5f5f5;
            color: #555;
            border: 1.5px solid #ddd;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            width: 100%;
        }

        .reset-btn:hover {
            background-color: #eee;
        }

        /* PILLOLE DI LIVELLO (Categorie in basso sopra la tab bar per pulizia assoluta) */
        .bottom-filters-panel {
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 500px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 2px;
            z-index: 90;
            scrollbar-width: none;
        }

        .bottom-filters-panel::-webkit-scrollbar {
            display: none;
        }

        .filter-pill-vertical {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1.5px solid #eee;
            padding: 8px 14px;
            border-radius: 25px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #444;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .filter-pill-vertical.active.cav {
            background-color: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        .filter-pill-vertical.active.ps {
            background-color: var(--danger);
            color: var(--white);
            border-color: var(--danger);
        }

        .filter-pill-vertical.active.police {
            background-color: var(--secondary);
            color: var(--white);
            border-color: var(--secondary);
        }

        .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-cav { background-color: #FF1493; }
        .dot-ps { background-color: #FF0000; }
        .dot-police { background-color: #0000FF; }

        /* BOTTONE GEOLOCALIZZAZIONE FLUTTUANTE (Spostato sopra i filtri) */
        .geolocate-fab {
            position: fixed;
            bottom: 135px;
            right: 15px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--white);
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 90;
            transition: transform 0.1s;
        }

        .geolocate-fab:active {
            transform: scale(0.92);
        }

        .geolocate-fab svg {
            width: 20px;
            height: 20px;
            fill: var(--success);
        }

        /* BARRA DI NAVIGAZIONE E AZIONE INFERIORE (BOTTOM TAB BAR - STYLE APP) */
        .bottom-nav-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 35px;
            padding: 8px 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            cursor: pointer;
            padding: 6px 0;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            margin-bottom: 3px;
            fill: #555;
            transition: fill 0.2s;
        }

        .nav-label {
            font-size: 0.65rem;
            font-weight: bold;
            color: #666;
            transition: color 0.2s;
        }

        /* Stati attivi per Tab Bar */
        .nav-item.active.cav .nav-icon { fill: var(--primary); }
        .nav-item.active.cav .nav-label { color: var(--primary); }
        
        .nav-item.active.ps .nav-icon { fill: var(--danger); }
        .nav-item.active.ps .nav-label { color: var(--danger); }
        
        .nav-item.active.police .nav-icon { fill: var(--secondary); }
        .nav-item.active.police .nav-label { color: var(--secondary); }

        /* PULSANTE EMERGENZA RAPIDA GIGANTE (SOS 1522) */
        .sos-btn-nav {
            background-color: var(--primary);
            color: var(--white);
            border-radius: 25px;
            padding: 10px 18px;
            font-weight: 850;
            font-size: 0.85rem;
            box-shadow: 0 4px 12px rgba(194, 24, 91, 0.4);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            border: none;
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 0 0 rgba(194, 24, 91, 0.5);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(194, 24, 91, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(194, 24, 91, 0);
            }
        }

        /* BOTTOM SHEET (Drawer di dettagli) */
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: 100%;
            max-width: 600px;
            background-color: var(--white);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -5px 30px rgba(0,0,0,0.15);
            z-index: 110; /* Stretto sopra la tab bar */
            padding: 20px 20px calc(20px + var(--safe-bottom)) 20px;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 80vh;
            overflow-y: auto;
        }

        .bottom-sheet.open {
            transform: translateX(-50%) translateY(0);
        }

        .sheet-handle {
            width: 40px;
            height: 5px;
            background-color: #ddd;
            border-radius: 3px;
            margin: -10px auto 15px auto;
        }

        .sheet-close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #eee;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            color: #666;
            font-weight: bold;
        }

        .detail-badge {
            background-color: var(--success);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .detail-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.3;
            margin-bottom: 6px;
            padding-right: 25px;
        }

        .detail-meta {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-divider {
            border-top: 1.5px solid var(--light);
            margin: 15px 0;
        }

        /* BOTTONI D'AZIONE DRAWER */
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            transition: opacity 0.2s;
        }

        .action-btn-call {
            background-color: var(--primary);
            color: var(--white);
        }

        .action-btn-email {
            background-color: var(--white);
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .action-btn-web {
            background-color: var(--white);
            color: var(--secondary);
            border: 2px solid var(--secondary);
        }

        .services-card {
            background-color: var(--light);
            padding: 14px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .services-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .services-list {
            list-style-type: none;
            padding-left: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .services-list li {
            font-size: 0.8rem;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* STILI DESKTOP */
        @media (min-width: 900px) {
            .bottom-sheet {
                left: 20px;
                bottom: 20px;
                transform: translateX(-150%);
                width: 360px;
                border-radius: 20px;
                max-height: calc(100vh - 40px);
            }

            .bottom-sheet.open {
                transform: translateX(0);
            }

            .geolocate-fab {
                bottom: 100px;
                left: 330px;
                right: auto;
            }

            .top-console {
                left: 20px;
                transform: translateX(0);
                width: 360px;
                top: 20px;
            }

            .bottom-filters-panel {
                left: 20px;
                transform: translateX(0);
                width: 360px;
                bottom: 85px;
            }

            .bottom-nav-bar {
                left: 20px;
                transform: translateX(0);
                width: 360px;
                bottom: 20px;
            }
        }
    </style>
    
    <!-- DEFINE DI SICUREZZA ASSOLUTA PER USCITA RAPIDA -->
    <script>
        window.triggerQuickExit = function() {
            window.location.replace("https://www.google.it");
        };
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                window.triggerQuickExit();
            }
        });
    </script>
</head>
<body>

    <!-- MAPPA FULL VIEWPORT -->
    <div id="map"></div>

    <!-- BRAND CARD FLUTTUANTE A SINISTRA (COMPATTA) -->
    <div class="brand-card">
        <span class="brand-title">Mappa Supporto Donna</span>
        <span class="brand-subtitle">Lombardia • Verificata 2026</span>
    </div>

    <!-- TASTO USCITA RAPIDA FLUTTUANTE A DESTRA (COMPLETAMENTE ISOLATO) -->
    <button class="quick-exit-fab" onclick="window.triggerQuickExit()">Uscita Rapida (Esc)</button>

    <!-- CONSOLE SUPERIORE UNIFICATA -->
    <div class="top-console">
        <!-- Barra di ricerca permanente -->
        <div class="search-bar-floating">
            <div class="search-input-wrapper-floating">
                <svg class="search-icon-floating" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <!-- Real Input Field: Sempre attivo e digitabile all'avvio! -->
                <input type="text" id="free-search" class="search-input-field" placeholder="Cerca per via, comune..." oninput="filterAll()" onkeydown="if(event.key === 'Enter') geocodeAddressSearch()">
                
                <!-- Tasto Cerca integrato direttamente nella barra -->
                <button class="search-action-btn-mini" onclick="geocodeAddressSearch()">Cerca</button>
                
                <!-- Tasto Ingranaggio per mostrare/nascondere i filtri avanzati Provincia/Comune -->
                <button class="expand-filters-btn" id="expand-filters-btn" onclick="toggleAdvancedFilters()" title="Filtri avanzati">⚙️</button>
            </div>
        </div>

        <!-- Pannello di Ricerca Avanzata Scomparsa (Provincia/Comune/Reset) -->
        <div class="advanced-filters-card" id="advanced-filters-card">
            <div class="select-group">
                <select id="select-provincia" class="custom-select" onchange="onProvinciaChange()">
                    <option value="">Provincia (Tutte)</option>
                    <option value="BG">Bergamo (BG)</option>
                    <option value="BS">Brescia (BS)</option>
                    <option value="CO">Como (CO)</option>
                    <option value="CR">Cremona (CR)</option>
                    <option value="LC">Lecco (LC)</option>
                    <option value="LO">Lodi (LO)</option>
                    <option value="MB">Monza (MB)</option>
                    <option value="MI">Milano (MI)</option>
                    <option value="MN">Mantova (MN)</option>
                    <option value="PV">Pavia (PV)</option>
                    <option value="SO">Sondrio (SO)</option>
                    <option value="VA">Varese (VA)</option>
                </select>
                
                <select id="select-comune" class="custom-select" disabled onchange="onComuneChange()">
                    <option value="">Comune (Tutti)</option>
                </select>
            </div>
            
            <button class="reset-btn" onclick="resetFilters()">Resetta Ricerca</button>
        </div>
    </div>

    <!-- FILTRI LIVELLO CATEGORIE (Posizionati in basso per pulizia e ordine) -->
    <div class="bottom-filters-panel">
        <div class="filter-pill-vertical active cav" id="pill-cav" onclick="toggleCategoryTab('CAV')">
            <span class="color-dot dot-cav"></span> 💗 Centri CAV
        </div>
        <div class="filter-pill-vertical active ps" id="pill-ps" onclick="toggleCategoryTab('SANITA')">
            <span class="color-dot dot-ps"></span> 🚑 P. Soccorso
        </div>
        <div class="filter-pill-vertical active police" id="pill-police" onclick="toggleCategoryTab('FORZE_ORDINE')">
            <span class="color-dot dot-police"></span> 🚓 Sicurezza
        </div>
    </div>

    <!-- BARRA DI NAVIGAZIONE E AZIONE INFERIORE (BOTTOM TAB BAR) -->
    <div class="bottom-nav-bar">
        <!-- Tab Centri Antiviolenza -->
        <div class="nav-item active" onclick="focusCategoryTab('CAV')">
            <svg class="nav-icon" viewBox="0 0 24 24" style="fill: var(--primary);">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.4 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.6 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span class="nav-label" style="color: var(--primary);">Centri CAV</span>
        </div>
        
        <!-- Tab Pronto Soccorso -->
        <div class="nav-item" onclick="focusCategoryTab('SANITA')">
            <svg class="nav-icon" viewBox="0 0 24 24" style="fill: var(--danger);">
                <path d="M19 3H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/>
            </svg>
            <span class="nav-label" style="color: var(--danger);">P. Soccorso</span>
        </div>
        
        <!-- Tab Forze dell'Ordine -->
        <div class="nav-item" onclick="focusCategoryTab('FORZE_ORDINE')">
            <svg class="nav-icon" viewBox="0 0 24 24" style="fill: var(--secondary);">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 15l-4-4 1.41-1.41L10 13.17l5.59-5.59L17 9l-7 7z"/>
            </svg>
            <span class="nav-label" style="color: var(--secondary);">Sicurezza</span>
        </div>
        
        <!-- Pulsante di Emergenza SOS 1522 Gigante -->
        <button class="sos-btn-nav" onclick="window.location.href='tel:1522'">
            📞 SOS 1522
        </button>
    </div>

    <!-- FLOAT ACTION BUTTON GEOLOCATE (FAB) -->
    <button class="geolocate-fab" id="geolocate-btn" onclick="geolocalizeUser()" title="Trova la mia posizione">
        <svg viewBox="0 0 24 24">

    <!-- BOTTOM SHEET (DRAWER DETTAGLI) -->
    <div class="bottom-sheet" id="bottom-sheet">
        <div class="sheet-handle"></div>
        <button class="sheet-close-btn" onclick="closeBottomSheet()">✕</button>
        
        <div id="sheet-content">

    <!-- LIBRERIE CARICATE IN MODO RIGIDAMENTE SINCRONO -->
    <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
    
    <script>
        // CONFIGURAZIONE GLOBALE MAPPA
        let map;
        let markers = [];
        let infoWindow;
        let clusterers = {};
        
        // Categorie caricate
        const layers = {
            'CAV': { file: 'data/cav.geojson', active: true, color: '#FF1493' },
            'SANITA': { file: 'data/pronto_soccorso.geojson', active: true, color: '#FF0000' },
            'FORZE_ORDINE': { file: 'data/forze_ordine.geojson', active: true, color: '#0000FF' }
        };

        // Centroidi province
        const provinceCentroids = {
            "BG": { lat: 45.6983, lng: 9.6773, zoom: 10 },
            "BS": { lat: 45.5416, lng: 10.2118, zoom: 10 },
            "CO": { lat: 45.8081, lng: 9.0852, zoom: 10.5 },
            "CR": { lat: 45.1333, lng: 10.0333, zoom: 10 },
            "LC": { lat: 45.8566, lng: 9.3977, zoom: 11 },
            "LO": { lat: 45.3167, lng: 9.5000, zoom: 11 },
            "MB": { lat: 45.5845, lng: 9.2735, zoom: 11.5 },
            "MI": { lat: 45.4642, lng: 9.1904, zoom: 10.5 },
            "MN": { lat: 45.1500, lng: 10.7833, zoom: 10 },
            "PV": { lat: 45.1850, lng: 9.1608, zoom: 10 },
            "SO": { lat: 46.1689, lng: 9.8731, zoom: 9.5 },
            "VA": { lat: 45.8196, lng: 8.8250, zoom: 10.5 }
        };

        // NUOVI SEGNAPOSTI ICONICI FLAT CIRCLES (Proposta 2) - 100% VISIBILI E LEGGERI
        // 1. Centri Antiviolenza (Pink): Cerchio rosa neon con icona Cuore bianco
        const svgCAV = (color) => 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
                    <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.3"/>
                </filter>
                <circle cx="12" cy="12" r="10" fill="${color}" stroke="#FFFFFF" stroke-width="1.8" filter="url(#glow)"/>
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.4 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.6 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#FFFFFF" transform="scale(0.5) translate(8, 8)"/>
            </svg>
        `);

        // 2. Pronto Soccorso (Red): Cerchio rosso d'emergenza con Croce Medica bianca
        const svgProntoSoccorso = (color) => 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
                    <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.3"/>
                </filter>
                <circle cx="12" cy="12" r="10" fill="${color}" stroke="#FFFFFF" stroke-width="1.8" filter="url(#glow)"/>
                <path d="M10 6h4v4h4v4h-4v4h-4v-4H6v-4h4z" fill="#FFFFFF"/>
            </svg>
        `);

        // 3. Forze dell'Ordine (Blue): Cerchio blu con icona Stella d'autorità bianca
        const svgForzeOrdine = (color) => 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
                    <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.3"/>
                </filter>
                <circle cx="12" cy="12" r="10" fill="${color}" stroke="#FFFFFF" stroke-width="1.8" filter="url(#glow)"/>
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" fill="#FFFFFF" transform="scale(0.52) translate(11, 11)"/>
            </svg>
        `);

        // RENDERER MINIMALISTA DEI CLUSTER
        const customClusterRenderer = {
            render: function({ count, position }, stats) {
                const size = count < 10 ? 28 : count < 100 ? 34 : 40;
                const radius = size / 2;
                
                const svg = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
                        <circle cx="${radius}" cy="${radius}" r="${radius - 2}" fill="#374151" fill-opacity="0.95" stroke="#FFFFFF" stroke-width="2"/>
                        <text x="${radius}" y="${radius + 4}" font-family="-apple-system, sans-serif" font-size="11px" font-weight="bold" fill="#FFFFFF" text-anchor="middle">${count}</text>
                    </svg>
                `);
                
                return new google.maps.Marker({
                    position,
                    icon: {
                        url: svg,
                        scaledSize: new google.maps.Size(size, size),
                        anchor: new google.maps.Point(radius, radius)
                    },
                    label: "", // Disabilita etichetta di default
                    zIndex: google.maps.Marker.MAX_ZINDEX + count
                });
            }
        };

        // MOSTRA/NASCONDI FILTRI PROVINCIA/COMUNE (Tasto Ingranaggio)
        function toggleAdvancedFilters() {
            const btn = document.getElementById("expand-filters-btn");
            const card = document.getElementById("advanced-filters-card");
            
            const isOpen = card.classList.toggle("open");
            btn.classList.toggle("active", isOpen);
        }

        // COSA SUCCEDE SE CLICCHI I MODULI IN BASSO DELLA NAV BAR
        function focusCategoryTab(category) {
            closeBottomSheet();
            closeSearchPanel();
            
            // Accendi solo la categoria selezionata
            for (const key of Object.keys(layers)) {
                const isTarget = key === category;
                layers[key].active = isTarget;
                
                const pillId = `pill-${key === 'CAV' ? 'cav' : key === 'SANITA' ? 'ps' : 'police'}`;
                const pill = document.getElementById(pillId);
                if (pill) {
                    if (isTarget) pill.classList.add("active");
                    else pill.classList.remove("active");
                }
            }
            
            // Trova il primo marker di quella categoria visibile e centrati sopra per immediatezza d'uso!
            const nearest = markers.find(m => m.category === category);
            if (nearest && map) {
                map.panTo(nearest.getPosition());
                map.setZoom(12);
            }
            
            filterAll();
        }

        // INIZIALIZZAZIONE DELLA MAPPA
        function initMap() {
            const lombardiaCenter = { lat: 45.67, lng: 9.60 };
            
            const customMapStyle = [
                { "featureType": "poi", "elementType": "all", "stylers": [{ "visibility": "off" }] },
                { "featureType": "transit.station", "elementType": "all", "stylers": [{ "visibility": "off" }] },
                { "featureType": "road", "elementType": "labels.icon", "stylers": [{ "visibility": "off" }] },
                { "featureType": "all", "elementType": "geometry", "stylers": [{ "saturation": -15 }, { "lightness": 10 }] }
            ];

            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 8.5,
                center: lombardiaCenter,
                styles: customMapStyle,
                mapTypeControl: false,
                streetViewControl: false,
                fullscreenControl: false,
                zoomControl: false
            });

            infoWindow = new google.maps.InfoWindow();

            // Inizializza i clusterers con il renderer personalizzato minimale (No cerchi blu!)
            if (window.markerClusterer && window.markerClusterer.MarkerClusterer) {
                clusterers = {
                    'CAV': new markerClusterer.MarkerClusterer({ map, markers: [], renderer: customClusterRenderer }),
                    'SANITA': new markerClusterer.MarkerClusterer({ map, markers: [], renderer: customClusterRenderer }),
                    'FORZE_ORDINE': new markerClusterer.MarkerClusterer({ map, markers: [], renderer: customClusterRenderer })
                };
            }

            // Avvia la geolocalizzazione automatica come primo passo assoluto
            autoGeolocalizeOnStart();

            loadAllLayers();
        }

        // GEOLOCALIZZAZIONE AUTOMATICA ALL'AVVIO CON SCOPE ZOOM ALLARGATO (ZOOM 12.5)
        function autoGeolocalizeOnStart() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const userLatLng = { lat: lat, lng: lon };

                        // Crea l'indicatore GPS verde dell'utente
                        window.userMarker = new google.maps.Marker({
                            position: userLatLng,
                            map: map,
                            title: "Tu sei qui",
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                fillColor: "#4CAF50",
                                fillOpacity: 1.0,
                                scale: 9,
                                strokeColor: "#FFFFFF",
                                strokeWeight: 2.5
                            }
                        });

                        // Centra la mappa e imposta lo zoom allargato (11.5) per visualizzare l'area circostante
                        map.setCenter(userLatLng);
                        map.setZoom(11.5);
                    },
                    (error) => {
                        console.log("Geolocalizzazione rifiutata o non disponibile all'avvio.");
                    },
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            }
        }

        // GEOLOCALIZZAZIONE ED INQUADRATURA TRAMITE BARRA DI RICERCA TESTUALE (OSM NOMINATIM - 100% Funzionante e slegata dalle chiavi di Google)
        function geocodeAddressSearch() {
            const searchText = document.getElementById("free-search").value.trim();
            if (!searchText) {
                alert("Digita una città o un indirizzo prima di cliccare su Cerca.");
                return;
            }
            
            const searchBtn = document.querySelector(".search-action-btn-mini");
            const originalText = searchBtn.textContent;
            searchBtn.textContent = "⏳";
            searchBtn.disabled = true;
            
            const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(searchText + ", Lombardia, Italia")}`;
            
            fetch(url)
            .then(response => {
                if (!response.ok) throw new Error("Errore di rete");
                return response.json();
            })
            .then(data => {
                if (data && data.length > 0) {
                    const result = data[0];
                    const lat = parseFloat(result.lat);
                    const lon = parseFloat(result.lon);
                    const searchLatLng = { lat: lat, lng: lon };
                    
                    // Sposta e centra la mappa nel luogo esatto desiderato dall'utente
                    map.panTo(searchLatLng);
                    map.setZoom(12.5); // Range intercomunale perfetto dello screen!
                    
                    if (window.userMarker) {
                        window.userMarker.setPosition(searchLatLng);
                    } else {
                        window.userMarker = new google.maps.Marker({
                            position: searchLatLng,
                            map: map,
                            title: "Posizione Cercata",
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                fillColor: "#4CAF50",
                                fillOpacity: 1.0,
                                scale: 9,
                                strokeColor: "#FFFFFF",
                                strokeWeight: 2.5
                            }
                        });
                    }
                    
                    closeSearchPanel();
                    filterAll();
                } else {
                    alert("Impossibile trovare la località cercata. Inserisci un comune o indirizzo lombardo valido.");
                }
            })
            .catch(err => {
                console.error("Geocoding fetch error:", err);
                alert("Si è verificato un errore durante la ricerca geografica. Riprova tra pochi istanti.");
            })
            .finally(() => {
                searchBtn.textContent = originalText;
                searchBtn.disabled = false;
            });
        }

        // CARICAMENTO DEI LAYER GEOJSON
        async function loadAllLayers() {
            for (const [key, config] of Object.entries(layers)) {
                try {
                    const response = await fetch(config.file);
                    const geojson = await response.json();
                    renderFeatures(geojson, key);
                } catch (e) {
                    console.error(`Error loading layer ${key}:`, e);
                }
            }
        }

        // FUNZIONE DI PARSING GEOGRAFICO
        function parseGeographicInfo(props, category) {
            let comune = props.comune || "";
            let provincia = props.provincia || "";
            const indirizzo = props.indirizzo || "";
            
            if (indirizzo && indirizzo !== "Indirizzo non disponibile") {
                const parts = indirizzo.split(",").map(p => p.trim());
                if (parts.length >= 1) {
                    const last = parts[parts.length - 1];
                    const provMatch = last.match(/\(([A-Z]{2})\)/);
                    if (provMatch) {
                        provincia = provMatch[1];
                        if (parts.length >= 2) {
                            comune = parts[parts.length - 2];
                        }
                    } else {
                        comune = last;
                        const zipMatch = indirizzo.match(/\b(\d{5})\b/);
                        if (zipMatch) {
                            const zip = zipMatch[1];
                            if (zip.startsWith("25")) provincia = "BS";
                            else if (zip.startsWith("24")) provincia = "BG";
                            else if (zip.startsWith("21")) provincia = "VA";
                            else if (zip.startsWith("22")) provincia = "CO";
                            else if (zip.startsWith("27")) provincia = "PV";
                            else if (zip.startsWith("46")) provincia = "MN";
                            else if (zip.startsWith("238") || zip.startsWith("239")) provincia = "LC";
                            else if (zip.startsWith("230") || zip.startsWith("231")) provincia = "SO";
                            else if (zip.startsWith("268") || zip.startsWith("269")) provincia = "LO";
                            else if (zip.startsWith("260") || zip.startsWith("261")) provincia = "CR";
                            else if (zip.startsWith("208") || zip.startsWith("209")) provincia = "MB";
                            else if (zip.startsWith("200") || zip.startsWith("201")) provincia = "MI";
                        }
                    }
                }
            }
            
            if (!provincia) {
                const title = (props.name || "").toUpperCase();
                if (title.includes("MILANO")) provincia = "MI";
                else if (title.includes("BRESCIA")) provincia = "BS";
                else if (title.includes("BERGAMO")) provincia = "BG";
                else if (title.includes("VARESE")) provincia = "VA";
                else if (title.includes("COMO")) provincia = "CO";
                else if (title.includes("PAVIA")) provincia = "PV";
                else if (title.includes("MONZA")) provincia = "MB";
                else if (title.includes("LECCO")) provincia = "LC";
                else if (title.includes("LODI")) provincia = "LO";
                else if (title.includes("CREMONA")) provincia = "CR";
                else if (title.includes("MANTOVA")) provincia = "MN";
                else if (title.includes("SONDRIO")) provincia = "SO";
            }
            
            if (!comune) {
                comune = (props.name || "");
            }
            
            try {
                comune = comune.replace(/\d+/g, '').replace(/[\(\)]/g, '')
                              .replace(/SPORTELLO DI/gi, "")
                              .replace(/CENTRO ANTIVIOLENZA/gi, "")
                              .replace(/STAZIONE CARABINIERI/gi, "")
                              .replace(/PRONTO SOCCORSO/gi, "")
                              .replace(/OSPEDALE/gi, "")
                              .replace(/PRESIDIO OSPEDALIERO/gi, "")
                              .replace(/COMANDO/gi, "")
                              .trim();
                              
                if (comune.includes(",")) {
                    comune = comune.split(",")[0].trim();
                }
            } catch (err) {
                comune = "";
            }
            
            return { 
                comune: (comune || "").toUpperCase(), 
                provincia: (provincia || "").toUpperCase() 
            };
        }

        // RENDERING DELLE FEATURES SULLA MAPPA (CON FOCUS ANCORAGGIO CENTRALE 12,12)
        function renderFeatures(geojson, category) {
            const tempMarkers = [];
            if (!geojson || !geojson.features) return;
            
            geojson.features.forEach(feature => {
                try {
                    const coords = feature.geometry.coordinates;
                    if (!coords || coords.length < 2) return;
                    
                    const latLng = new google.maps.LatLng(coords[1], coords[0]);
                    const props = feature.properties || {};

                    let pinColor = layers[category].color;
                    if (props.colore_marker) {
                        pinColor = props.colore_marker;
                    }

                    let customIconUrl = "";
                    if (category === "CAV") {
                        customIconUrl = svgCAV(pinColor);
                    } else if (category === "SANITA") {
                        customIconUrl = svgProntoSoccorso(pinColor);
                    } else if (category === "FORZE_ORDINE") {
                        customIconUrl = svgForzeOrdine(pinColor);
                    }

                    // Ancoraggio impostato a 12,12 (al centro perfetto) per far fluttuare correttamente i cerchi sulla mappa!
                    const marker = new google.maps.Marker({
                        position: latLng,
                        title: props.name,
                        icon: {
                            url: customIconUrl,
                            scaledSize: new google.maps.Size(24, 24),
                            anchor: new google.maps.Point(12, 12)
                        }
                    });

                    const geoInfo = parseGeographicInfo(props, category);
                    marker.category = category;
                    marker.provincia = geoInfo.provincia;
                    marker.comune = geoInfo.comune;
                    marker.props = props;

                    marker.addListener("click", () => {
                        displayFeatureDetails(props, category);
                    });

                    markers.push(marker);
                    tempMarkers.push(marker);
                } catch (err) {
                    console.error("Error rendering single feature:", err);
                }
            });

            if (clusterers[category]) {
                clusterers[category].addMarkers(tempMarkers);
            }
        }

        // MOSTRA I DETTAGLI NEL BOTTOM SHEET

                badgeBg = "var(--secondary)";

            let html = `

                    </a>
                `;

                html += `
                    <a href="tel:${numEmergency}" class="action-btn action-btn-call">

                    </a>
                `;
            }

            if (props.email) {
                html += `

                        ✉️ INVIA UN'E-MAIL
                    </a>
                `;
            }

            if (props.sito_web) {
                html += `
                    <a href="${props.sito_web}" target="_blank" rel="noopener noreferrer" class="action-btn action-btn-web">
                        🌐 VISITA IL SITO WEB
                    </a>
                `;
            }
            
            html += `</div>`;

            html += `
                <div class="services-card">
                    <div class="services-title">Servizi & Note di Sicurezza:</div>
                    <ul class="services-list">
            `;

            if (category === "CAV") {
                html += `
                    <li>🧠 Supporto Psicologico e Psicoterapeutico</li>
                    <li>⚖️ Assistenza Legale e Gratuito Patrocinio</li>
                    <li>🏠 Raccordo e inserimento protetto in Case Rifugio</li>
                    <li>💼 Orientamento lavorativo e autonomia</li>
                    <li>🛡️ Riservatezza assoluta e Anonimato garantito</li>
                `;
            } else if (category === "SANITA") {
                html += `
                    <li>🌸 Percorso assistenziale protetto "Codice Rosa"</li>
                    <li>🩺 Assistenza medica specialistica e reperimento</li>
                    <li>💰 Esente da ticket sanitario per vittime di violenza</li>
                `;
            } else if (category === "FORZE_ORDINE") {
                html += `
                    <li>🛡️ Ricezione denunce e querele per reati di violenza</li>
                    <li>🚨 Attivazione immediata del protocollo "Codice Rosso"</li>
                    <li>🚓 Pronto intervento sul posto in caso di flagranza</li>
                `;
            }

            html += `
                    </ul>
                </div>
            `;

            sheetContent.innerHTML = html;
            document.getElementById("bottom-sheet").classList.add("open");
        }

        // CHIUDI IL BOTTOM SHEET
        function closeBottomSheet() {
            document.getElementById("bottom-sheet").classList.remove("open");
        }

        // GESTIONE DEI FILTRI CATEGORIA TRAMITE TAB BAR INFERIORE
        function toggleCategoryTab(category) {
            const pillId = `pill-${category === 'CAV' ? 'cav' : category === 'SANITA' ? 'ps' : 'police'}`;
            const pill = document.getElementById(pillId);
            if (pill) {
                const isActive = pill.classList.toggle("active");
                layers[category].active = isActive;
                filterAll();
            }
        }

        // FILTRAGGIO ED INCROCIO DATI GENERALE (RESILIENTE)
        function filterAll() {
            closeBottomSheet();
            
            const freeSearchInput = document.getElementById("free-search");
            const selectProvinciaInput = document.getElementById("select-provincia");
            const selectComuneInput = document.getElementById("select-comune");
            
            const textSearch = freeSearchInput ? freeSearchInput.value.toUpperCase().trim() : "";
            const selProvincia = selectProvinciaInput ? selectProvinciaInput.value : "";
            const selComune = selectComuneInput ? selectComuneInput.value : "";
            
            // Aggiorna l'anteprima di testo sulla barra di ricerca floating
            const searchTriggerText = document.getElementById("search-trigger-text");
            if (searchTriggerText) {
                if (textSearch) searchTriggerText.textContent = `Filtro: "${textSearch}"`;
                else if (selComune) searchTriggerText.textContent = `Filtro: ${selComune}`;
                else if (selProvincia) searchTriggerText.textContent = `Filtro: Prov. ${selProvincia}`;
                else searchTriggerText.textContent = "Cerca per via, comune...";
            }

            for (const key of Object.keys(clusterers)) {
                if (clusterers[key]) clusterers[key].clearMarkers();
            }
            
            const activeMarkersByLayer = { 'CAV': [], 'SANITA': [], 'FORZE_ORDINE': [] };
            
            markers.forEach(marker => {
                try {
                    const categoryActive = layers[marker.category].active;
                    const matchesProvincia = !selProvincia || marker.provincia === selProvincia;
                    const matchesComune = !selComune || marker.comune === selComune;
                    
                    let matchesText = true;
                    if (textSearch) {
                        const name = (marker.props.name || "").toUpperCase();
                        const addr = (marker.props.indirizzo || "").toUpperCase();
                        const com = (marker.comune || "").toUpperCase();
                        matchesText = name.includes(textSearch) || addr.includes(textSearch) || com.includes(textSearch);
                    }
                    
                    if (categoryActive && matchesProvincia && matchesComune && matchesText) {
                        marker.setMap(map);
                        if (activeMarkersByLayer[marker.category]) {
                            activeMarkersByLayer[marker.category].push(marker);
                        }
                    } else {
                        marker.setMap(null);
                    }
                } catch (err) {
                    console.error("Error filtering single marker:", err);
                }
            });
            
            for (const key of Object.keys(clusterers)) {
                if (clusterers[key] && activeMarkersByLayer[key]) {
                    clusterers[key].addMarkers(activeMarkersByLayer[key]);
                }
            }
        }

        // CAMBIO PROVINCIA (Dinamico)
        function onProvinciaChange() {
            const selProvincia = document.getElementById("select-provincia").value;
            const selectComune = document.getElementById("select-comune");
            
            selectComune.innerHTML = '<option value="">Comune (Tutti)</option>';
            selectComune.value = "";
            
            if (selProvincia) {
                selectComune.disabled = false;
                
                const comuniUnici = new Set();
                markers.forEach(marker => {
                    if (marker.provincia === selProvincia && marker.comune) {
                        comuniUnici.add(marker.comune);
                    }
                });
                
                const comuniOrdinati = Array.from(comuniUnici).sort();
                comuniOrdinati.forEach(comune => {
                    if (comune && comune !== "INDIRIZZO NON DISPONIBILE") {
                        const opt = document.createElement("option");
                        opt.value = comune;
                        opt.textContent = comune.charAt(0) + comune.slice(1).toLowerCase();
                        selectComune.appendChild(opt);
                    }
                });
                
                const centroid = provinceCentroids[selProvincia];
                if (centroid && map) {
                    map.panTo({ lat: centroid.lat, lng: centroid.lng });
                    map.setZoom(centroid.zoom);
                }
            } else {
                selectComune.disabled = true;
            }
            
            filterAll();
        }

        // CAMBIO COMUNE
        function onComuneChange() {
            const selComune = document.getElementById("select-comune").value;
            
            if (selComune && map) {
                const markerComune = markers.find(m => m.comune === selComune && m.getMap());
                if (markerComune) {
                    map.panTo(markerComune.getPosition());
                    map.setZoom(13.5);
                }
            }
            
            filterAll();
        }

        // RESET FILTRI
        function resetFilters() {
            document.getElementById("free-search").value = "";
            document.getElementById("select-provincia").value = "";
            
            const selectComune = document.getElementById("select-comune");
            selectComune.innerHTML = '<option value="">Comune (Tutti)</option>';
            selectComune.value = "";
            selectComune.disabled = true;
            
            for (const key of Object.keys(layers)) {
                layers[key].active = true;
                const pillId = `pill-${key === 'CAV' ? 'cav' : key === 'SANITA' ? 'ps' : 'police'}`;
                const pillElement = document.getElementById(pillId);
                if (pillElement) pillElement.classList.add("active");
            }
            
            if (map) {
                map.panTo({ lat: 45.67, lng: 9.60 });
                map.setZoom(8.5);
            }
            
            filterAll();
            closeSearchPanel();
        }

        // GEOLOCALIZZAZIONE UTENTE MANUALE (Zoom 14.5)
        function geolocalizeUser() {
            if (!navigator.geolocation) {
                alert("La geolocalizzazione non è supportata dal tuo browser.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const userLatLng = { lat: lat, lng: lon };

                    if (window.userMarker) {
                        window.userMarker.setPosition(userLatLng);
                    } else {
                        window.userMarker = new google.maps.Marker({
                            position: userLatLng,
                            map: map,
                            title: "Tu sei qui",
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                fillColor: "#4CAF50",
                                fillOpacity: 1.0,
                                scale: 9,
                                strokeColor: "#FFFFFF",
                                strokeWeight: 2.5
                            }
                        });
                    }

                    if (map) {
                        map.panTo(userLatLng);
                        map.setZoom(14.5);
                    }
                },
                (error) => {
                    alert("Impossibile rilevare la tua posizione. Verifica di avre concesso i permessi GPS al tuo browser.");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
    </script>
